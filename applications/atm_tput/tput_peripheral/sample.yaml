sample:
  description: BLE throughput sample
  name: BLE throughput sample
common:
  sysbuild: true
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Advertising successfully started"
  tags:
    - bluetooth
    - atm_test_with_spe
    - role_peripheral
tests:
  applications.atm_tput.tput_peripheral.atm:
    tags:
      - openair_release
  applications.atm_tput.tput_peripheral.atm.mcuboot.flash_xip:
    tags:
      - mcuboot
      - flash_xip
    depends_on:
      - flash
      - rram
      - xip
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_APP_FLASH_XIP;-DATM_MCUBOOT_SWAP_WITH_OFFSET=0"
      - mcuboot_CONFIG_UPDATEABLE_IMAGE_NUMBER=2
  applications.atm_tput.tput_peripheral.atm.mcuboot.flash_xip.overwrite:
    tags:
      - mcuboot
      - flash_xip
      - overwrite
    depends_on:
      - flash
      - rram
      - xip
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_APP_FLASH_XIP;-DATM_MCUBOOT_SCRATCH_SIZE=0"
      - mcuboot_CONFIG_UPDATEABLE_IMAGE_NUMBER=2
      - mcuboot_CONFIG_MCUBOOT_VERIFY_IMG_ADDRESS=n
  applications.atm_tput.tput_peripheral.atm.two_dev:
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Received test end command"
    tags:
      - two_dev
    extra_configs:
      - CONFIG_ATM_TPUT_AUTO_TEST=y
