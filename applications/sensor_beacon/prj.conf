# BT Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_DEVICE_NAME="Atmosic Sensor Beacon"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=22

# Extended advertising configuration for dual advertising sets
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

# LED and Button support
CONFIG_GPIO=y
CONFIG_INPUT=y

# Battery measurement
CONFIG_ADC=y
CONFIG_ADC_LOG_LEVEL_ERR=y

# Sensor measurement - ALWAYS ENABLED (core functionality)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SENSOR_LOG_LEVEL_WRN=y

# Application configuration
CONFIG_SENSOR_BEACON_UPDATE_INTERVAL=100
CONFIG_ATM_SETTINGS=y

# Sensor scaling factors (optimized for ±16g range and mobile app compatibility)
CONFIG_SENSOR_BEACON_TEMP_SCALING_FACTOR=256
CONFIG_SENSOR_BEACON_HUMIDITY_SCALING_FACTOR=256
CONFIG_SENSOR_BEACON_ACCEL_SCALING_FACTOR=1000

# Stack sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Stack sentinel
CONFIG_STACK_SENTINEL=y

# C library
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# Logging - MINIMAL (warnings and errors only)
CONFIG_LOG=y
# Warning level for production
CONFIG_LOG_DEFAULT_LEVEL=2
# Application module logging
CONFIG_SENSOR_BEACON_LOG_LEVEL_WRN=y

# AT command framework
CONFIG_ATM_AT_CMD=y
CONFIG_AT_CMD_SET=y
CONFIG_AT_CMD_LOCK_SET=y
CONFIG_AT_CMD_SYSUNLOCKKEY_VALUE="atm1atm123"
CONFIG_AT_CMD_BLEGAPDEVNAME=y
CONFIG_AT_CMD_BLEGAPDEVNAME_CB=y
CONFIG_AT_CMD_BLEADVLEGACYPARM=y
CONFIG_AT_CMD_BLEADVLEGACYPARM_CB=y
CONFIG_AT_CMD_BLEADVDATA=y
CONFIG_AT_CMD_BLEADVDATA_CB=y

# Bluetooth buffer configuration for AT commands
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255

# Storage for persistent settings
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# BT features for AT command support
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y

# Disable unused BT features to save memory and power
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=n

# Disable debugging features for production
CONFIG_THREAD_RUNTIME_STATS=n
