# BT Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_DEVICE_NAME="Sensor Beacon Debug"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=22

# Extended advertising configuration for dual advertising sets
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

# LED and Button support
CONFIG_GPIO=y
CONFIG_INPUT=y

# Battery measurement
CONFIG_ADC=y
CONFIG_ADC_LOG_LEVEL_DBG=y

# Sensor measurement - ALWAYS ENABLED (core functionality)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y

# Application configuration
CONFIG_SENSOR_BEACON_UPDATE_INTERVAL=100
CONFIG_ATM_SETTINGS=y

# Application module logging
CONFIG_SENSOR_BEACON_LOG_LEVEL_DBG=y

# Sensor scaling factors (optimized for ±16g range and mobile app compatibility)
CONFIG_SENSOR_BEACON_TEMP_SCALING_FACTOR=256
CONFIG_SENSOR_BEACON_HUMIDITY_SCALING_FACTOR=256
CONFIG_SENSOR_BEACON_ACCEL_SCALING_FACTOR=1000

# Stack sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Stack sentinel
CONFIG_STACK_SENTINEL=y

# C library
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# Logging - SELECTIVE DEBUG (application debug, OS info only)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=y

# Increase log buffer to reduce dropped messages
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=10
CONFIG_LOG_BLOCK_IN_THREAD=y

# Disable specific noisy debug modules
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_LOG_OVERRIDE_LEVEL=3

# Bluetooth debug logging - selective (uncomment as needed)
#CONFIG_BT_CONN_LOG_LEVEL_DBG=y
#CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=y

# AT command framework
CONFIG_ATM_AT_CMD=y
CONFIG_ATM_AT_CMD_SET=y

# Bluetooth buffer configuration for AT commands
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255

# Storage for persistent settings
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# BT features for AT command support
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y

# Disable unused BT features to save memory and power
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=n
