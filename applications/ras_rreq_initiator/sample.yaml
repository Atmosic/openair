sample:
  name: Bluetooth Central RAS RREQ Initiator
  description: Demonstrates the ranging requestor RAS
common:
  sysbuild: true
  harness: console
  harness_config:
    type: one_line
    regex:
      - "scan entry"
  tags:
    - bluetooth
    - channel_sounding
  depends_on:
    - channel_sounding
tests:
  applications.ras_rreq_initiator.atm:
    extra_args:
      - spe_DTC_OVERLAY_FILE=${ZEPHYR_OPENAIR_MODULE_DIR}/applications/ras_rreq_initiator/spe_uart0.overlay
  applications.ras_rreq_initiator.atm.ipt:
    extra_args:
      - spe_DTC_OVERLAY_FILE=${ZEPHYR_OPENAIR_MODULE_DIR}/applications/ras_rreq_initiator/spe_uart0.overlay
    extra_configs:
      - CONFIG_ENABLE_CS_REF_IPT=y
  applications.ras_rreq_initiator.atm.ipt.no_rd_sub:
    extra_args:
      - spe_DTC_OVERLAY_FILE=${ZEPHYR_OPENAIR_MODULE_DIR}/applications/ras_rreq_initiator/spe_uart0.overlay
    extra_configs:
      - CONFIG_ENABLE_CS_REF_IPT=y
      - CONFIG_RREQ_DISABLE_RD_SUB=y
  applications.ras_rreq_initiator.atm.ras_c_shell:
    extra_configs:
      - CONFIG_RAS_CLIENT_SHELL=y
      - CONFIG_LOG_BACKEND_UART=y
      - CONFIG_SHELL_LOG_BACKEND=n
  applications.ras_rreq_initiator.atm.pwr_info:
    extra_configs:
      - CONFIG_BT_TRANSMIT_POWER_CONTROL=y
      - CONFIG_READ_RSSI=y
  applications.ras_rreq_initiator.atm.phy_update:
    extra_configs:
      - CONFIG_ATM_BT_PHY_UPDATE=y
  applications.ras_rreq_initiator.atm.mcuboot.flash_xip:
    tags:
      - mcuboot
      - flash_xip
    depends_on:
      - flash
      - rram
      - xip
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_APP_FLASH_XIP"
      - mcuboot_CONFIG_UPDATEABLE_IMAGE_NUMBER=2
  applications.ras_rreq_initiator.atm.mcuboot.flash_xip.legacy_scratch:
    tags:
      - mcuboot
      - flash_xip
      - legacy
    depends_on:
      - flash
      - rram
      - xip
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_APP_FLASH_XIP;-DATM_MCUBOOT_SWAP_WITH_OFFSET=0"
      - mcuboot_CONFIG_UPDATEABLE_IMAGE_NUMBER=2
  applications.ras_rreq_initiator.atm.mcuboot.flash_xip.overwrite:
    tags:
      - mcuboot
      - flash_xip
      - overwrite
    depends_on:
      - flash
      - rram
      - xip
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_APP_FLASH_XIP;-DATM_MCUBOOT_SCRATCH_SIZE=0"
      - mcuboot_CONFIG_UPDATEABLE_IMAGE_NUMBER=2
      - mcuboot_CONFIG_MCUBOOT_VERIFY_IMG_ADDRESS=n
  applications.ras_rreq_initiator.atm.two_dev:
    tags:
      - two_dev
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=no_button.overlay
      - spe_DTC_OVERLAY_FILE=${ZEPHYR_OPENAIR_MODULE_DIR}/applications/ras_rreq_initiator/spe_uart0.overlay
    extra_configs:
      - CONFIG_BT_LOG_SNIFFER_INFO=y
    harness: pytest
    timeout: 600
    harness_config:
      pytest_root: ["pytest"]
  applications.ras_rreq_initiator.atm.two_dev.quick:
    tags:
      - two_dev
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=no_button.overlay
      - spe_DTC_OVERLAY_FILE=${ZEPHYR_OPENAIR_MODULE_DIR}/applications/ras_rreq_initiator/spe_uart0.overlay
    extra_configs:
      - CONFIG_BT_LOG_SNIFFER_INFO=y
      - CONFIG_ATM_CS_QUICK_TEST=y
    timeout: 720
    harness_config:
      type: one_line
      regex:
        - "Init Proc:3000"
