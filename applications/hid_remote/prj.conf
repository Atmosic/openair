# BT core
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3
CONFIG_BT_ID_MAX=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_MAX_CONN=3
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Hibernation-retained pairing-mode marker
CONFIG_RETAINED_MEM=y

# Enable GATT client so the peripheral can initiate an MTU exchange when the
# host supports it. ATVV v1.0 sends one 128-byte notification per audio frame.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=146
CONFIG_BT_BUF_ACL_TX_SIZE=146
CONFIG_BT_BUF_ACL_RX_SIZE=146
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_ATT_TX_COUNT=20
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_RC_PDM_DEBUG=n
CONFIG_ATM_DMIC_CAPTURE_ON_RISING=y

# Connection parameter preferences
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=99
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# DIS
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_MANUF_NAME_STR="Atmosic Tech."
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x045E
CONFIG_BT_DIS_PNP_PID=0x0050
CONFIG_BT_DIS_PNP_VER=0x0100

# BAS
CONFIG_BT_BAS=y

# Device identity
CONFIG_BT_DEVICE_NAME="Atmosic RC"
CONFIG_BT_DEVICE_APPEARANCE=384

# Stack sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_STACK_SENTINEL=y

# Settings / NVS
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Input subsystem
CONFIG_INPUT=y

# SMF (MMI + GAP state machine)
CONFIG_SMF=y

# Vendor API commands
CONFIG_ATM_VENDOR_API=y
CONFIG_VND_API_SET_ADV_TX_POWER=y
CONFIG_VND_API_SET_CON_TX_POWER=y

# HOGP
CONFIG_ATM_HOGP=y

# FMP — Find Me Profile
CONFIG_BT_IAS=y

# VOICE / AUDIO
CONFIG_RC_VOICE=y

# IR/NEC blaster
CONFIG_IR_NEC=y

# Log
CONFIG_LOG=y