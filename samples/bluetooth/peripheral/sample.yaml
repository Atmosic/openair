sample:
  name: Bluetooth Peripheral
  description: Demonstrates the BLE Peripheral role
common:
  tags:
    - bluetooth
    - role_peripheral
tests:
  samples.bluetooth.peripheral.atm:
    sysbuild: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Indicate VND attr"
    tags:
      - openair_release
  samples.bluetooth.peripheral.atm.mcuboot:
    sysbuild: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Indicate VND attr"
    tags:
      - mcuboot
      - openair_release_mcuboot
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
  samples.bluetooth.peripheral.atm.mcuboot.legacy_scratch:
    sysbuild: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Indicate VND attr"
    tags:
      - mcuboot
      - legacy
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_MCUBOOT_SWAP_WITH_OFFSET=0"
