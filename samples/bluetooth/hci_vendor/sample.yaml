sample:
  description: Atmosic HCI vendor sample
  name: Atmosic HCI vendor sample
common:
  tags:
    - bluetooth
    - role_all
  harness: console
  harness_config:
    type: one_line
    regex:
      - "atm_hci_init done"
  sysbuild: true
  extra_configs:
    - CONFIG_BT_SETTINGS=y
tests:
  samples.bluetooth.hci_vendor.atm.pd50:
    tags:
      - openair_release
    extra_configs:
      - CONFIG_ATMWSTK_PD50=y
  samples.bluetooth.hci_vendor.atm: &base_config
    tags:
      - openair_release
    extra_args:
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
  samples.bluetooth.hci_vendor.atm.rx_dc_cal:
    <<: *base_config
    extra_configs:
      - CONFIG_ATM_HCI_RESET_RX_DC_CAL=y
  samples.bluetooth.hci_vendor.atm.gcov:
    <<: *base_config
    tags:
      - gcov
    depends_on:
      - gcov_capable
    timeout: 180
    extra_configs:
      - CONFIG_UU_TEST_OPENAIR="atm_vendor.c;atm_hci_uart.c"
  samples.bluetooth.hci_vendor.atm.mcuboot:
    tags:
      - mcuboot
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
  samples.bluetooth.hci_vendor.atm.mcuboot.pd50:
    tags:
      - mcuboot
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
      - SB_CONFIG_ATMWSTK_PD50=y
  samples.bluetooth.hci_vendor.atm.mcuboot.sec_debug:
    tags:
      - mcuboot
      - sec_debug
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS='-DUSE_ATM_SECURE_DEBUG'
      - mcuboot_CONFIG_ATM_MCUBOOT_SECURE_DEBUG=y
      - mcuboot_CONFIG_ATM_MCUBOOT_UART_DEBUG_AUTH_TIMEOUT_MS=50000
  samples.bluetooth.hci_vendor.atm.mcuboot.sec_debug.pd50:
    tags:
      - mcuboot
      - sec_debug
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
      - SB_CONFIG_ATMWSTK_PD50=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS='-DUSE_ATM_SECURE_DEBUG'
      - mcuboot_CONFIG_ATM_MCUBOOT_SECURE_DEBUG=y
      - mcuboot_CONFIG_ATM_MCUBOOT_UART_DEBUG_AUTH_TIMEOUT_MS=50000
  # Legacy configurations for backward compatibility
  samples.bluetooth.hci_vendor.atm.mcuboot.legacy_scratch:
    tags:
      - mcuboot
      - legacy
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_MCUBOOT_SWAP_WITH_OFFSET=0"
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
  samples.bluetooth.hci_vendor.atm.pytest_psm:
    tags:
      - bluetooth
      - psm
    harness: pytest
    timeout: 300
    harness_config:
      pytest_root: ["pytest/test_hci_vendor_psm.py"]
      pytest_dut_scope: class
      pytest_args:
        - "-v"
        - "-k"
        - "not test_psm_hibernate"
    extra_args:
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
      - EXTRA_DTC_OVERLAY_FILE=system_level_test.overlay
      - OVERLAY_CONFIG=system_level_test.conf
  samples.bluetooth.hci_vendor.atm.pytest_psm_hibernate:
    tags:
      - bluetooth
      - psm
    harness: pytest
    timeout: 120
    harness_config:
      pytest_root: ["pytest/test_hci_vendor_psm.py"]
      pytest_dut_scope: class
      pytest_args:
        - "-v"
        - "-k"
        - "test_psm_hibernate"
    extra_args:
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
      - EXTRA_DTC_OVERLAY_FILE=system_level_test.overlay
      - OVERLAY_CONFIG=system_level_test.conf
