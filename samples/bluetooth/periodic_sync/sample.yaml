sample:
  name: Bluetooth Periodic Advertising Synchronization
common:
  tags:
    - bluetooth
    - role_central
  sysbuild: true
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Waiting for periodic advertising"
tests:
  samples.bluetooth.periodic_sync.atm:
    extra_args:
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
