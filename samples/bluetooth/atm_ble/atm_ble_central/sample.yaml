sample:
  name: ATM BLE central sample
common:
  tags:
    - atm_test_with_spe
    - bluetooth
    - role_central
tests:
  samples.bluetooth.atm_ble.atm_ble_central.atm:
    tags:
      - openair_release
    sysbuild: true
    harness: console
    harness_config:
      type: one_line
      regex:
      - "Scanning successfully started|Device found"
    extra_args:
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
