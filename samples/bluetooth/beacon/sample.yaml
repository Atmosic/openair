sample:
  name: Bluetooth Beacon
common:
  tags:
    - bluetooth
    - role_peripheral
    - role_broadcaster
  sysbuild: true
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Identity:"
  # Expected log as <inf> bt_hci_core: Identity: for observer to parse BD ADDR
  extra_configs:
    - CONFIG_LOG=y
    - CONFIG_BT_HCI_CORE_LOG_LEVEL_INF=y
tests:
  # Uses common extra_args from above
  samples.bluetooth.beacon.atm:
    tags:
      - openair_release
  samples.bluetooth.beacon.atm.two_dev:
    tags:
      - two_dev
  samples.bluetooth.beacon.atm.two_dev.spe.flash_xip:
    tags:
      - two_dev
      - flash_xip
      - atm_test_with_spe
    depends_on:
      - flash
      - rram
      - xip
    extra_args:
      - SB_CONFIG_SPE=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_APP_FLASH_XIP"
