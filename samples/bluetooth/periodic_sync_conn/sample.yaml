sample:
  name: Bluetooth Periodic Advertising Sync Connection Procedure
common:
  tags:
    - bluetooth
    - role_central
tests:
  samples.bluetooth.periodic_sync_conn.atm:
    sysbuild: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - Starting Periodic Advertising with Responses Synchronization Demo
    extra_args:
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
