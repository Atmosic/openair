sample:
  name: Bluetooth Extended Advertising Scanner
common:
  tags:
    - bluetooth
    - role_central
tests:
  samples.bluetooth.extended_adv.scanner.atm:
    sysbuild: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - Starting Extended Advertising Demo
    extra_args:
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
  samples.bluetooth.extended_adv.scanner.atm.two_dev:
    sysbuild: true
    timeout: 60
    tags:
      - two_dev
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Connected state!"
    extra_args:
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y

