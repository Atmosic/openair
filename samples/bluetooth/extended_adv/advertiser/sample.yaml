sample:
  name: Bluetooth Extended Advertising Advertiser
common:
  tags:
    - bluetooth
    - role_peripheral
    - role_broadcaster
tests:
  samples.bluetooth.extended_adv.advertiser.atm:
    sysbuild: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - Starting Extended Advertising Demo
  samples.bluetooth.extended_adv.advertiser.atm.two_dev:
    sysbuild: true
    timeout: 60
    tags:
      - two_dev
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Connected state!"

