sample:
  name: BME280 Sensor sample
common:
  tags:
    - sensor
  sysbuild: true
  harness: console
  harness_config:
    type: one_line
    regex:
      - 'Found device "bme280@.*"'
tests:
  samples.sensor.bme280.atm: {}
  samples.sensor.bme280.atm.spi:
    extra_args:
      - SHIELD=mikroe_weather_click_spi
