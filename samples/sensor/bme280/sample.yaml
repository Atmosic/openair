sample:
  name: BME280 Sensor sample
common:
  tags:
    - sensor
  # The overlays always instantiate the bme280 node, so only a board actually
  # carrying the sensor can answer the I2C or SPI probe.
  depends_on:
    - bme280
  sysbuild: true
  harness: console
  harness_config:
    type: one_line
    regex:
      - 'Found device "bme280@.*"'
tests:
  samples.sensor.bme280.atm: {}
  samples.sensor.bme280.atm.spi:
    extra_args:
      - DTC_OVERLAY_FILE="boards/spi.overlay"
