sample:
  description: Sample demonstrating adding NS-callable functions
  name: NSC hello world
common:
  tags:
    - introduction
    - requires_trustzone
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Hello from Secure World"
  sysbuild: true
tests:
  sample.nsc_hello_world: {}
  samples.nsc_hello_world.atm:
    extra_args:
      - SB_CONFIG_SPE=y
      - spe_CONFIG_ATM_ENABLE_NSC_EXAMPLE=y
