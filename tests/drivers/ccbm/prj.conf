# Enable CCBM driver
CONFIG_ATM_CCBM=y
CONFIG_ATM_CCBM_AUTO_INIT=y

# Enable testing framework
CONFIG_ZTEST=y

# Enable logging for debugging
CONFIG_LOG=y
CONFIG_CCBM_LOG_LEVEL_DBG=y

# Enable BLE for radio HAL manager
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_ATM_EUI_ALLOW_RANDOM=y
