# UART ATM Idle Detection Test Configuration

# Enable ztest framework
CONFIG_ZTEST=y

# Enable UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Enable GPIO (required for RX idle detection)
CONFIG_GPIO=y

# Enable logging for debugging
CONFIG_LOG=y

# Enable the detection feature
CONFIG_UART_ATM_HOST_DETECT=y
