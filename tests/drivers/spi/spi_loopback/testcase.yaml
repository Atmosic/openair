common:
  sysbuild: true
  harness: ztest
  extra_configs:
    - CONFIG_SPI_LOOPBACK_MODE_LOOP=y
    - CONFIG_SPI_IDEAL_TRANSFER_DURATION_SCALING=30

tests:
  tests.drivers.spi.spi_loopback.atm.gcov:
    tags:
      - gcov
    depends_on:
      - gcov_capable
    extra_configs:
      - CONFIG_UU_TEST_OPENAIR="spi_atm.c;pinctrl_atm.c"
  tests.drivers.spi.spi_loopback.atm.clk_gate.gcov:
    tags:
      - gcov
    depends_on:
      - gcov_capable
    extra_configs:
      - CONFIG_SPI_ATM_AUTO_CLK_GATE=y
      - CONFIG_UU_TEST_OPENAIR="spi_atm.c;pinctrl_atm.c"
