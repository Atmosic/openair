common:
  tags:
    - drivers
    - flash
    - atm_test_with_spe
  sysbuild: true
tests:
  tests.drivers.flash.common.atm: {}
  tests.drivers.flash.common.atm.mcuboot:
    tags:
      - mcuboot
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_MCUBOOT_SWAP_WITH_OFFSET=0"
  tests.drivers.flash.common.atm.ruid:
    extra_args:
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DTEST_STORAGE_IN_FLASH;-DCONFIG_FLASH_ATM_RUID=y"
  tests.drivers.flash.common.atm.ruid.spe.flash_xip:
    tags:
      - flash_xip
    extra_args:
      - SB_CONFIG_SPE=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_APP_FLASH_XIP;-DTEST_STORAGE_IN_FLASH;-DCONFIG_FLASH_ATM_RUID=y"
  tests.drivers.flash.common.atm.ruid.mcuboot.flash_xip:
    tags:
      - flash_xip
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_APP_FLASH_XIP;-DCONFIG_FLASH_ATM_RUID=y;-DATM_MCUBOOT_SWAP_WITH_OFFSET=0"
      - mcuboot_CONFIG_UPDATEABLE_IMAGE_NUMBER=2
  tests.drivers.flash.common.atm.wo_ext_flash:
    tags:
      - wo_ext_flash
    extra_args:
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DFLASH_SIZE=0;-DATM_ALLOW_FLASH_DISABLE"
