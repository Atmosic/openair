tests:
  tests.drivers.pwm.pwm_atm_fifo.atm: &base_config
    sysbuild: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - PROJECT EXECUTION SUCCESSFUL
    extra_args:
      - SB_CONFIG_ATMWSTK_PD50=y

  tests.drivers.pwm.pwm_atm_fifo.atm.gcov:
    <<: *base_config
    tags:
      - gcov
    depends_on:
      - gcov_capable
    timeout: 180
    extra_configs:
      - CONFIG_UU_TEST_OPENAIR="pwm_atm.c"
