common:
  sysbuild: true
  tags:
    - drivers
    - pwm
    - buzzer
    - atm_buzzer
  # app.overlay wires the atmosic,atm3x-pwm-buzzer node to pwm3, which only the
  # ATM3x PWM block routes.
  depends_on:
    - atm3x_pwm

tests:
  tests.drivers.buzzer.atm: &base_config {}

  tests.drivers.buzzer.atm.gcov:
    <<: *base_config
    tags:
      - gcov
    depends_on:
      - gcov_capable
    timeout: 180
    extra_configs:
      - CONFIG_UU_TEST_OPENAIR="atm_buzzer.c"
