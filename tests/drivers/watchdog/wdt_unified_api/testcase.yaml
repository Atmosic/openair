common:
  tags:
    - drivers
    - watchdog
  depends_on:
    - wdt
tests:
  tests.drivers.watchdog.wdt_unified_api.atm:
    sysbuild: true
    tags:
      - wdt_unified_api
  tests.drivers.watchdog.wdt_unified_api.atm.gcov:
