common:
  # boards/common.overlay dereferences &i2s, so the overlay only compiles on a
  # SoC declaring that node.
  depends_on:
    - i2s
tests:
  tests.subsys.audio.stream.i2s_stress.atm: &base_config
    sysbuild: true
    timeout: 100
    tags:
      - audio
  tests.subsys.audio.stream.i2s_stress.atm.gcov:
    <<: *base_config
    tags:
      - gcov
    depends_on:
      - gcov_capable
    timeout: 180
    extra_configs:
      - CONFIG_UU_TEST_OPENAIR="audio_stream.c"
