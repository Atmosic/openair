common:
  sysbuild: true
  tags:
    - dfu
    - mcuboot
    - at_cmd
    - at_cmd_dfu
  depends_on:
    - flash
    - rram
  extra_args:
    - SB_CONFIG_BOOTLOADER_MCUBOOT=y
    - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
    - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
  timeout: 600

tests:
  tests.subsys.dfu.at_cmd_dfu.atm.mcuboot.pytest.single_image:
    harness: pytest
    extra_args:
      - SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_MCUBOOT_SWAP_WITH_OFFSET=0"
      - DTC_OVERLAY_FILE=app_pytest.overlay
    extra_configs:
      - CONFIG_SERIAL=y
      - CONFIG_REBOOT=y
    harness_config:
      pytest_root: ["pytest/test_at_cmd_dfu_swap.py"]
      pytest_args:
        - "-v"
        - "--dfu-mode=single"

  tests.subsys.dfu.at_cmd_dfu.atm.mcuboot.pytest.flash_xip.dual_image:
    harness: pytest
    tags:
      - flash_xip
    depends_on:
      - xip
    extra_args:
      - SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_APP_FLASH_XIP;-DATM_STORAGE_SIZE=0x1000;-DATM_MCUBOOT_SCRATCH_SIZE=0"
      - mcuboot_CONFIG_UPDATEABLE_IMAGE_NUMBER=2
      - DTC_OVERLAY_FILE=app_pytest.overlay
    extra_configs:
      - CONFIG_SERIAL=y
      - CONFIG_REBOOT=y
    harness_config:
      pytest_root: ["pytest/test_at_cmd_dfu_swap.py"]
      pytest_args:
        - "-v"
        - "--dfu-mode=dual"
