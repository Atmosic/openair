common:
  sysbuild: true
  tags:
    - mcuboot
    - flash
    - dfu_mcuboot
    - flash_xip
  depends_on:
    - flash
    - rram
    - xip
  extra_args:
    - SB_CONFIG_BOOTLOADER_MCUBOOT=y
    - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
    - SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
    - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
    - SB_ATM_DTS_EXTRA_CPPFLAGS="-DATM_APP_FLASH_XIP"
    - mcuboot_CONFIG_UPDATEABLE_IMAGE_NUMBER=2
tests:
  tests.subsys.dfu.mcuboot_multi.atm.mcuboot.flash_xip: {}
  tests.subsys.dfu.mcuboot_multi.atm.mcuboot.flash_xip.overwrite:
    tags:
      - overwrite
    extra_args:
      - SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
  tests.subsys.dfu.mcuboot_multi.atm.mcuboot.flash_xip.sec_debug:
    tags:
      - sec_debug
    extra_args:
      - SB_ATM_DTS_EXTRA_CPPFLAGS='-DUSE_ATM_SECURE_DEBUG;-DATM_APP_FLASH_XIP'
      - mcuboot_CONFIG_ATM_MCUBOOT_SECURE_DEBUG=y
      - mcuboot_CONFIG_ATM_MCUBOOT_UART_DEBUG_AUTH_TIMEOUT_MS=50000
  tests.subsys.dfu.mcuboot_multi.atm.mcuboot.flash_xip.sec_debug.overwrite:
    tags:
      - sec_debug
      - overwrite
    extra_args:
      - SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS='-DUSE_ATM_SECURE_DEBUG;-DATM_APP_FLASH_XIP'
      - mcuboot_CONFIG_ATM_MCUBOOT_SECURE_DEBUG=y
      - mcuboot_CONFIG_ATM_MCUBOOT_UART_DEBUG_AUTH_TIMEOUT_MS=50000
  tests.subsys.dfu.mcuboot_multi.atm.mcuboot.flash_xip.skip_validate:
    extra_args:
      - mcuboot_CONFIG_ATM_MCUBOOT_SKIP_PRIMARY_VALIDATE_HIBER=y
  tests.subsys.dfu.mcuboot_multi.atm.mcuboot.flash_xip.skip_validate.overwrite:
    tags:
      - overwrite
    extra_args:
      - mcuboot_CONFIG_ATM_MCUBOOT_SKIP_PRIMARY_VALIDATE_HIBER=y
      - SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
  tests.subsys.dfu.mcuboot_multi.atm.mcuboot.flash_xip.skip_validate.sec_debug:
    tags:
      - sec_debug
    extra_args:
      - mcuboot_CONFIG_ATM_MCUBOOT_SKIP_PRIMARY_VALIDATE_HIBER=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS='-DUSE_ATM_SECURE_DEBUG;-DATM_APP_FLASH_XIP'
      - mcuboot_CONFIG_ATM_MCUBOOT_SECURE_DEBUG=y
      - mcuboot_CONFIG_ATM_MCUBOOT_UART_DEBUG_AUTH_TIMEOUT_MS=50000
  tests.subsys.dfu.mcuboot_multi.atm.mcuboot.flash_xip.skip_validate.overwrite.sec_debug:
    tags:
      - sec_debug
      - overwrite
    extra_args:
      - mcuboot_CONFIG_ATM_MCUBOOT_SKIP_PRIMARY_VALIDATE_HIBER=y
      - SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
      - SB_ATM_DTS_EXTRA_CPPFLAGS='-DUSE_ATM_SECURE_DEBUG;-DATM_APP_FLASH_XIP'
      - mcuboot_CONFIG_ATM_MCUBOOT_SECURE_DEBUG=y
      - mcuboot_CONFIG_ATM_MCUBOOT_UART_DEBUG_AUTH_TIMEOUT_MS=50000
