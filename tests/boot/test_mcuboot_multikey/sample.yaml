sample:
  name: MCUboot Multiple Key Test Application
common:
  sysbuild: true
  tags:
    - mcuboot
    - flash
    - multikey
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "I: Starting bootloader"
      - "Launching primary slot application on (.*)"
      - "Secondary application ready for swap, rebooting"
      - "I: Starting swap using (.*)|I: Image 0 upgrade secondary slot -> primary slot"
      - "Swapped application booted on (.*)"
tests:
  tests.boot.test_mcuboot_multikey.atm.mcuboot:
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
      - SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
      - mcuboot_EXTRA_KCONFIG_OPTIONS="CONFIG_BOOT_MULTIPLE_SIGNATURE_KEYS=y;CONFIG_BOOT_SIGNATURE_KEY_FILE=\"\${${CMAKE_CURRENT_SOURCE_DIR}}/test-key-1.pem\";CONFIG_BOOT_SIGNATURE_KEY_FILE_2=\"\${${CMAKE_CURRENT_SOURCE_DIR}}/test-key-2.pem\""

