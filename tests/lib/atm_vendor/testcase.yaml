tests:
  tests.lib.atm_vendor.atm: &base_config
    sysbuild: true
    harness: ztest
    tags:
      - bluetooth
      - atm_vendor
    extra_args:
      - SB_CONFIG_DTS_EXTRA_SELECT_CPD200_HINT=y
    timeout: 60
  tests.lib.atm_vendor.atm.gcov:
    <<: *base_config
    tags:
      - gcov
    depends_on:
      - gcov_capable
    timeout: 180
    extra_configs:
      - CONFIG_UU_TEST_OPENAIR="atm_vendor.c;atm_hci_uart.c"
