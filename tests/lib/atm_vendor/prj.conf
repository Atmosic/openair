CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_ZTEST_NO_YIELD=n

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_HCI_RAW_CMD_EXT=y
CONFIG_BT_BUF_CMD_TX_SIZE=140

CONFIG_ATM_VENDOR=y
CONFIG_VND_PSM=y

# Keep the radio settings across sleeps for deterministic testing
CONFIG_ATM_BLE_DRIVER_SLEEP=n

# Match the sample - avoid PM RX thread stack overflow when logging is heavy
CONFIG_UART_ATM_PM_RX_THREAD_STACK_SIZE=2048

# Required so vendor_psm_config exists (guarded by #if CONFIG_PM)
CONFIG_PM=y
CONFIG_PM_DEVICE=y

CONFIG_LOG=y
CONFIG_ATM_VENDOR_LOG_LEVEL_DBG=y
CONFIG_ATM_HCI_UART_LOG_LEVEL_DBG=y
