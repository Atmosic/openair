tests:
  tests.lib.atm_shell.atm:
    sysbuild: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - "atm shell test! (.*)"
    extra_configs:
      - CONFIG_LOG_BACKEND_UART=y
      - CONFIG_SHELL_LOG_BACKEND=n
