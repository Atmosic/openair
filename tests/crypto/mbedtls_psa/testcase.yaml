# The goal here is to showcase that Mbed TLS's PSA crypto implementation can be
# supported on any platform. A very minimal configuration is tested here: simply
# enable support for PSA crypto APIs in Mbed TLS and then test them with:
# - psa_crypto_init() which is required before any PSA crypto operation
# - psa_generate_random() which is always available as long as PSA crypto is
#   initialized.
#
# Since it might take too long to execute this test on all platforms
# supported by Zephyr, we reduce to a very small selected group whose
# characteristics are:
# - no TF-M enabled devices because we assume that the TF-M implementation
#   of PSA crypto is working fine on the platforms that support TF-M.
# - platform should be testable by the CI.
# - pick 1 platform which supports entropy driver and 1 which does not. The
#   latter case will allow to test
#   CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG_ALLOW_NON_CSPRNG.
common:
  sysbuild: true
  tags:
    - crypto
    - mbedtls
    - psa
  extra_configs:
    - CONFIG_ATM_AES_HW=y
    - CONFIG_ATM_SHA2_HW=y
    # Enable AES-CTR so the CTR paths in the Atmosic AES PSA wrapper (and the
    # CTR-256 software-fallback path) are exercised by the AES test cases.
    - CONFIG_PSA_WANT_ALG_CTR=y
    # The "mldsa-native" Zephyr module is not part of the openair manifest,
    # so disable PQCP MLDSA which would otherwise pull in mldsa_native.h.
    - CONFIG_TF_PSA_CRYPTO_PQCP_MLDSA_ENABLED=n
    - CONFIG_TF_PSA_CRYPTO_PQCP_MLDSA_87_ENABLED=n

# Coverage twins: each functional scenario is anchored with &base_* so its
# .gcov twin inherits the same config via "<<:" and adds only the gcov-specific
# keys. YAML merge is shallow, so depends_on / extra_configs sequences are
# re-stated in the twin where the base sets them. See the "Zephyr Coverage"
# guide (Confluence page 879525936) for the pattern.
tests:
  tests.crypto.mbedtls_psa.atm: &base_single {}
  # Single-context, PIO data path. Also runs the upstream SHA/AES cases and
  # the AES test cases, so this twin instruments both the SHA-2 and AES files.
  tests.crypto.mbedtls_psa.atm.gcov:
    <<: *base_single
    tags:
      - gcov
    depends_on:
      - gcov_capable
    timeout: 300
    extra_configs:
      - CONFIG_UU_TEST_OPENAIR="atm_sha2.c;psa_sha256.c;atm_aes.c;psa_aes.c"

  tests.crypto.mbedtls_psa.atm.sha2_dma: &base_dma
    extra_configs:
      - CONFIG_ATM_SHA2_HW_DATA_PATH_DMA=y
  # Single-context, DMA data path: adds the SHA-2 DMA push/digest code paths.
  tests.crypto.mbedtls_psa.atm.sha2_dma.gcov:
    <<: *base_dma
    tags:
      - gcov
    depends_on:
      - gcov_capable
    timeout: 300
    extra_configs:
      - CONFIG_ATM_SHA2_HW_DATA_PATH_DMA=y
      - CONFIG_UU_TEST_OPENAIR="atm_sha2.c;psa_sha256.c"

  tests.crypto.mbedtls_psa.atm.sha2_multi: &base_multi
    depends_on:
      - sha2_multi_context
    extra_configs:
      - CONFIG_ATM_SHA2_API_MULTI=y
  # Multi-context, PIO: adds the clone / pool / save-restore code paths and
  # the multithreaded stress cases.
  tests.crypto.mbedtls_psa.atm.sha2_multi.gcov:
    <<: *base_multi
    tags:
      - gcov
    depends_on:
      - sha2_multi_context
      - gcov_capable
    timeout: 300
    extra_configs:
      - CONFIG_ATM_SHA2_API_MULTI=y
      - CONFIG_UU_TEST_OPENAIR="atm_sha2.c;psa_sha256.c"

  tests.crypto.mbedtls_psa.atm.sha2_dma_multi: &base_dma_multi
    depends_on:
      - sha2_multi_context
    extra_configs:
      - CONFIG_ATM_SHA2_HW_DATA_PATH_DMA=y
      - CONFIG_ATM_SHA2_API_MULTI=y
  # Multi-context, DMA: the multi-context code paths over the DMA push path.
  tests.crypto.mbedtls_psa.atm.sha2_dma_multi.gcov:
    <<: *base_dma_multi
    tags:
      - gcov
    depends_on:
      - sha2_multi_context
      - gcov_capable
    timeout: 300
    extra_configs:
      - CONFIG_ATM_SHA2_HW_DATA_PATH_DMA=y
      - CONFIG_ATM_SHA2_API_MULTI=y
      - CONFIG_UU_TEST_OPENAIR="atm_sha2.c;psa_sha256.c"
