# STACK SIZE
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# LOG
CONFIG_LOG=y
CONFIG_BT_RAS_LOG_LEVEL_DBG=y

# Power Management
CONFIG_PM=n

# BT
CONFIG_BT_ATT_TX_COUNT=4
CONFIG_BT_DEVICE_NAME="Atmosic_BLE_Shell"
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_L2CAP_TX_BUF_COUNT=2

# SETTINGS
CONFIG_FLASH_PAGE_LAYOUT=y

# STACK SENTINEL
CONFIG_STACK_SENTINEL=y

# APP work queue
CONFIG_APP_WORK_Q=y
CONFIG_SMF=y

# Disable unused features
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_EATT=n
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_GATT_NOTIFY_MULTIPLE=n
CONFIG_BT_HRS=n
CONFIG_BT_FILTER_ACCEPT_LIST=n
CONFIG_BT_FIXED_PASSKEY=n
CONFIG_BT_PASSKEY_KEYPRESS=n
CONFIG_BT_REMOTE_INFO=n
CONFIG_BT_REMOTE_VERSION=n
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=n
CONFIG_BT_ISO_BROADCASTER=n
CONFIG_BT_ISO_SYNC_RECEIVER=n
CONFIG_BT_ISO_CENTRAL=n
CONFIG_BT_ISO_PERIPHERAL=n
CONFIG_BT_L2CAP_ECRED=n
CONFIG_BT_SIGNING=n
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_MINIMAL_LIBC_STRING_ERROR_TABLE=n
CONFIG_TEST=n
CONFIG_TEST_LOGGING_DEFAULTS=n