set SWDBOARD_TYPE SWDBOARD_EVK
if {[info exists ::env(SWDBOARD_TYPE)]} {
    set SWDBOARD_TYPE $::env(SWDBOARD_TYPE)
}

if {![info exists ::env(SWDIF)] || $::env(SWDIF) eq "FTDI"} {
    puts "Using FTDI"
    source [find atm_ftdi.tcl]
} elseif {$::env(SWDIF) eq "JLINK"} {
    error "JLINK is not supported for ATM5"
} else {
    error [format "Unknown SWDIF=%s setting" $::env(SWDIF)]
}

set _SWD_KHZ [expr {[info exists ::env(PARIS_SWD_KHZ)] ? $::env(PARIS_SWD_KHZ) : 300}]

set _RESET_HARD_TIME 100
if {[info exists ::env(FTDI_RESET_HARD_TIME)]} {
    set _RESET_HARD_TIME $::env(FTDI_RESET_HARD_TIME)
    puts "_RESET_HARD_TIME set to $_RESET_HARD_TIME"
}

if {![info exists ::env(FTDI_HARD_RESET)]} {
    source [find m33_cpu.tcl]
    if {![info exists ::env(FL_RUN_EMU)] || ![string equal $::env(FL_RUN_EMU) "1"]} {
	if {[info exists ::env(FAST_LOAD)] && $::env(FAST_LOAD) eq "1"} {
	    source [find fast_load/atm_fast_load.tcl]
	    source [find fast_load/atm_fast_load_prog.cfg]
	    source [find fast_load/atm_fast_load.cfg]
	}
    }
}

proc set_reset {} {
    assert_pwd
}

proc release_reset [list [list reset_time $::_RESET_HARD_TIME] ] {
    sleep $reset_time
    deassert_pwd
}

proc set_benign_boot {} {
    assert_bboot
}

proc set_normal_boot {} {
    deassert_bboot
}

proc init_rr_nb_exit {} {
    init
    release_reset
    sleep 100
    set_normal_boot
    exit
}

proc set_vbat {} {
    assert_vbat
}

proc release_vbat {} {
    deassert_vbat
}

proc set_vccio {} {
    assert_vccio
}

proc release_vccio {} {
    deassert_vccio
}

proc set_ls {} {
    assert_ls
}

proc release_ls {} {
    deassert_ls
}

# Start with low frequency in case Backplane clock is running slowly
adapter speed 100

gdb_port disabled
telnet_port disabled
tcl_port disabled

source [find atm_top.tcl]
