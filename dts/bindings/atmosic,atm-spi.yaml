description: Atmosic SPI

compatible: "atmosic,atm-spi"

include: [spi-controller.yaml, pinctrl-device.yaml]

properties:
    reg:
      required: true

    interrupts:
      required: false

    instance:
      type: int
      required: true
      description: SPI instance

    dummy_cycles:
      type: int
      required: false
      default: 0
      description: Number of extra shift cycles to help with the turn-around

    pinctrl-0:
      required: true

    pinctrl-names:
      required: true
