description: Atmosic secure non volatile memory ROM protection support

compatible: "atmosic,sec-nv-mem-rom-prot"

include: base.yaml

properties:
  blk-size:
    type: int
    required: true
    description: Size in bytes of the ROM protection block size
  read-prot-size:
    type: int
    required: true
    description: Length in bytes of configurable read protection from the beginning of the memory area
