# Common fields for ADC controllers

include: adc-controller.yaml

properties:
    resolution:
      type: int
      required: true

    ch-cell:
      type: int
      required: false

    ch-store:
      type: int
      required: false

    ch-core:
      type: int
      required: false

    ch-temp:
      type: int
      required: false

    ch-p1diff:
      type: int
      required: false

    ch-p0diff:
      type: int
      required: false

    ch-p1single0:
      type: int
      required: false

    ch-p1single1:
      type: int
      required: false

    ch-p0single0:
      type: int
      required: false

    ch-p0single1:
      type: int
      required: false

    ch-batt:
      type: int
      required: false

    ch-p2single:
      type: int
      required: false

    ch-p3single:
      type: int
      required: false

    ch-p4single:
      type: int
      required: false

    temp-output-scale:
      type: int
      description: |
        Temperature channel output denominator. The ADC driver returns
        temperature as an integer where 1 LSB = 1/temp-output-scale degC.
        100 = centi-degC (0.01 degC/LSB).
        256 = S8.8 fixed-point (1/256 degC/LSB).
        Defaults to 100 (centi-degC) when not specified.
      enum:
        - 100
        - 256
      default: 100

io-channel-cells:
    - input
