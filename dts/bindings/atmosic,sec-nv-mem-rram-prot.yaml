description: Atmosic secure non volatile memory RRAM protection support

compatible: "atmosic,sec-nv-mem-rram-prot"

include: base.yaml

properties:
  blk-size:
    type: int
    required: true
    description: Size in bytes of the RRAM protection block size
  write-prot-size:
    type: int
    required: true
    description: Length in bytes of configurable write protection from the beginning of the memory area
  read-prot-size:
    type: int
    required: true
    description: Length in bytes of configurable read protection from the beginning of the memory area
