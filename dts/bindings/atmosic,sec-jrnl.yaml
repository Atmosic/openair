description: Atmosic secure journal

compatible: "atmosic,sec-jrnl"

include: base.yaml

properties:
  reg:
    required: false

  flash-journal-size:
    type: int
    description: |
      Size in bytes of the mapped NVM (Flash) region used as the
      secondary journal source.  When present, the driver falls back
      to this region after the primary source is exhausted.  The base
      address of the region is supplied by the board via the
      SEC_JOURNAL_BASE define.

  has-status-field:
    type: boolean
    description: |
      Indicates that each TLV tag header contains a status byte
      between the tag byte and the length field, giving a 4-byte
      header {tag, status, length[2]}.  When absent the header is
      the compact 3-byte form {tag, length[2]}.

  otp-journal-offset:
    type: int
    default: 0
    description: |
      Byte offset within the OTP address space where the secure
      journal region begins.

  otp-journal-size:
    type: int
    description: |
      Size in bytes of the OTP region reserved for the secure
      journal.
