description: PWM-driven buzzer.

compatible: "atmosic,atm3x-pwm-buzzer"

include: base.yaml

properties:
  pwms:
    required: true
    type: phandle-array
    description: PWM specifier driving the buzzer.

  min-frequency:
    required: true
    type: int
    description: Minimum frequency supported by this buzzer (Hz).

  max-frequency:
    required: true
    type: int
    description: Maximum frequency supported by this buzzer (Hz).
